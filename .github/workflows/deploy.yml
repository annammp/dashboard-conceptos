name: verificar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Fronteras entre capas
        run: npm run check:boundaries

      # Las fechas son el punto donde un error se ve como "mi concepto cayó en
      # el día equivocado", así que la suite corre con dos zonas horarias.
      - name: Pruebas con TZ=America/Mexico_City
        run: npm run test:coverage
        env:
          TZ: America/Mexico_City

      - name: Pruebas con TZ=UTC
        run: npm run test:unit
        env:
          TZ: UTC

      - name: Que no se haya colado la service_role key
        run: |
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git \
               -e 'service_role' -e 'SUPABASE_SERVICE' . ; then
            echo "::error::Se encontró una referencia a service_role. Esa llave nunca va al repo."
            exit 1
          fi
          echo "Sin rastros de service_role."

      - name: Construir
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_DATA_DRIVER: supabase

      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium

      # Los e2e corren contra el driver local: herméticos, sin tocar Supabase.
      - name: Pruebas end-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
