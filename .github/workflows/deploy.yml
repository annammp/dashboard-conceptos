name: verificar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Fronteras entre capas
        run: npm run check:boundaries

      # Las fechas son el punto donde un error se ve como "mi concepto cayó en
      # el día equivocado", así que la suite corre con dos zonas horarias.
      - name: Pruebas con TZ=America/Mexico_City
        run: npm run test:coverage
        env:
          TZ: America/Mexico_City

      - name: Pruebas con TZ=UTC
        run: npm run test:unit
        env:
          TZ: UTC

      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium

      # Los e2e van ANTES del build de producción, y el orden importa: para
      # previsualizar, Playwright ejecuta su propio `npm run build` con
      # base '/' y el driver local. Si corrieran después, lo que se publicaría
      # sería el build de las pruebas, con las rutas rotas y sin Supabase.
      - name: Pruebas end-to-end
        run: npm run test:e2e

      - name: Construir para producción
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_DATA_DRIVER: supabase

      # Después de construir, para que también revise el bundle que se publica.
      - name: Que no se haya colado una llave de servicio
        run: npm run check:secrets

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
